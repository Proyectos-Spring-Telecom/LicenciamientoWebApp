<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs [@fadeInRight] style="position: fixed;" current="Módulos" link="{{titulo}}"></fury-breadcrumbs>
  </fury-page-layout-header>
  
  <fury-page-layout-content [@fadeInUp]>
    <mat-card>
      <div class="encabezado">
        <div class="row Modulo">
          <span class="h3"> <i i class="fas fa-boxes"></i>&nbsp;Módulos</span>
          <app-boton-exportar-tabla [tipoBoton]="'grid'" [nombreArchivo]="'Módulos'" [datos]="datosReporte"
            [buttonDisabled]="isDisabled">
          </app-boton-exportar-tabla>
          <ng-container *ngxPermissionsOnly="[permisoAgregarModulo]">
            <button type="submit" class="agregar" (click)="agregarModulo()" style="margin-right: 15px;">
              <i class="fas fa-plus"></i>&nbsp;&nbsp;Agregar
            </button>
          </ng-container>
        </div>
      </div>
      <br> <mat-divider class="mt-3"></mat-divider> <br>
      <ng-container>
        <div class="data-grid">
          <dx-data-grid id="gridContainer" [columnHidingEnabled]="true" [dataSource]="listaModulos" [showBorders]="true" [rowAlternationEnabled]="true">
            <dxo-paging [pageSize]="7"></dxo-paging>
            <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[7, 10, 50, 100]" [showInfo]="true"></dxo-pager>
            <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
            <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
            <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
            <ng-container *ngxPermissionsOnly="[permisoActualizarModulo, permisoEliminarModulo]">
              <dxi-column caption="Acciones" cellTemplate="acciones" alignment="center" [width]="150">
              </dxi-column>
            </ng-container>
            <dxi-column dataField="id" caption="ID" alignment="center">
              <dxo-header-filter [allowSearch]="true"></dxo-header-filter>
            </dxi-column>
            <dxi-column dataField="nombre" caption="Nombre" alignment="center">
              <dxo-header-filter [allowSearch]="true"></dxo-header-filter>
            </dxi-column>
            <div *dxTemplate="let row of 'acciones'">
              <ng-container *ngxPermissionsOnly="[permisoActualizarModulo]">
                <dx-button valueExpr="id" id="actualizarButton" class="btnAcciones"
                  (click)="actualizarModulo(row.data.id)">
                  <i class="fas fa-pen"></i>
                </dx-button>&nbsp;&nbsp;&nbsp;
              </ng-container>
              <ng-container *ngxPermissionsOnly="[permisoEliminarModulo]">
                <dx-button valueExpr="id" id="deleteButton" class="btnAccione" (click)="eliminarModulo(row.data)">
                  <i class="fa fa-trash"></i>
                </dx-button>
              </ng-container>
            </div>
          </dx-data-grid>
        </div>
      </ng-container>
    </mat-card>
  </fury-page-layout-content>
</fury-page-layout>
